<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Productos</ion-title>
    <ion-buttons slot="end" *ngIf="isAdmin()">
      <ion-button (click)="abrirModalCrear()">Nuevo</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list>
    <ion-item *ngFor="let producto of productos">
      <ion-label>
        <h2>{{ producto.nombre }}</h2>
        <p>Precio: ${{ producto.precio }} | Stock: {{ producto.stock }}</p>
      </ion-label>
      <ion-buttons slot="end" *ngIf="isAdmin()">
        <ion-button color="primary" (click)="abrirModalEditar(producto)">
          Editar
        </ion-button>
        <ion-button color="danger" (click)="confirmarEliminar(producto)">
          Eliminar
        </ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>

  <ion-grid>
    <ion-row class="ion-justify-content-center ion-align-items-center">
      <ion-col size="auto">
        <ion-button [disabled]="!previous" (click)="paginaAnterior()">Anterior</ion-button>
      </ion-col>
      <ion-col size="auto">
        <ion-label>{{ currentPage }} / {{ maxPages }}</ion-label>
      </ion-col>
      <ion-col size="auto">
        <ion-button [disabled]="!next" (click)="paginaSiguiente()">Siguiente</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>

<!-- Modal Crear/Editar -->
<ion-modal [isOpen]="modalAbierto" (didDismiss)="cerrarModal()">
  <ng-template>
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>{{ modoEdicion ? 'Editar Producto' : 'Nuevo Producto' }}</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="cerrarModal()">Cerrar</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <ion-item>
        <ion-input
          label="Nombre"
          labelPlacement="floating"
          [(ngModel)]="productoSeleccionado.nombre"
          placeholder="Nombre del producto">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Descripción"
          labelPlacement="floating"
          [(ngModel)]="productoSeleccionado.descripcion"
          placeholder="Descripción del producto">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Precio"
          labelPlacement="floating"
          type="number"
          [(ngModel)]="productoSeleccionado.precio"
          placeholder="0.00">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Stock"
          labelPlacement="floating"
          type="number"
          [(ngModel)]="productoSeleccionado.stock"
          placeholder="0">
        </ion-input>
      </ion-item>

      <ion-button expand="block" class="ion-margin-top" (click)="guardarProducto()">
        {{ modoEdicion ? 'Actualizar' : 'Crear' }}
      </ion-button>
    </ion-content>
  </ng-template>
</ion-modal>
