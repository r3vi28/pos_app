<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Clientes</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="abrirModalCrear()">Nuevo</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list>
    <ion-item *ngFor="let cliente of clientes">
      <ion-label>
        <h2>{{ cliente.nombre }} {{ cliente.apellido }}</h2>
        <p>{{ cliente.email }}</p>
        <p *ngIf="cliente.telefono">Tel: {{ cliente.telefono }}</p>
      </ion-label>
      <ion-buttons slot="end">
        <ion-button color="primary" (click)="abrirModalEditar(cliente)">
          Editar
        </ion-button>
        <ion-button color="danger" *ngIf="isAdmin()" (click)="confirmarEliminar(cliente)">
          Eliminar
        </ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>

  <ion-grid>
    <ion-row class="ion-justify-content-center ion-align-items-center">
      <ion-col size="auto">
        <ion-button [disabled]="!previous" (click)="paginaAnterior()">Anterior</ion-button>
      </ion-col>
      <ion-col size="auto">
        <ion-label>{{ currentPage }} / {{ maxPages }}</ion-label>
      </ion-col>
      <ion-col size="auto">
        <ion-button [disabled]="!next" (click)="paginaSiguiente()">Siguiente</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>

<!-- Modal Crear/Editar -->
<ion-modal [isOpen]="modalAbierto" (didDismiss)="cerrarModal()">
  <ng-template>
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>{{ modoEdicion ? 'Editar Cliente' : 'Nuevo Cliente' }}</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="cerrarModal()">Cerrar</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <ion-item>
        <ion-input
          label="Nombre"
          labelPlacement="floating"
          [(ngModel)]="clienteSeleccionado.nombre"
          placeholder="Nombre del cliente">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Apellido"
          labelPlacement="floating"
          [(ngModel)]="clienteSeleccionado.apellido"
          placeholder="Apellido del cliente">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Email"
          labelPlacement="floating"
          type="email"
          [(ngModel)]="clienteSeleccionado.email"
          placeholder="email@ejemplo.com">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Teléfono"
          labelPlacement="floating"
          [(ngModel)]="clienteSeleccionado.telefono"
          placeholder="809-000-0000">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Dirección"
          labelPlacement="floating"
          [(ngModel)]="clienteSeleccionado.direccion"
          placeholder="Dirección del cliente">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label>¿Tiene RNC?</ion-label>
        <ion-toggle [(ngModel)]="clienteSeleccionado.have_rnc"></ion-toggle>
      </ion-item>

      <ion-item *ngIf="clienteSeleccionado.have_rnc">
        <ion-input
          label="RNC"
          labelPlacement="floating"
          [(ngModel)]="clienteSeleccionado.rnc"
          placeholder="00000000000 (9-11 dígitos)"
          (ionInput)="validarRncInput($event)">
        </ion-input>
      </ion-item>

      <ion-button expand="block" class="ion-margin-top" (click)="guardarCliente()">
        {{ modoEdicion ? 'Actualizar' : 'Crear' }}
      </ion-button>
    </ion-content>
  </ng-template>
</ion-modal>
